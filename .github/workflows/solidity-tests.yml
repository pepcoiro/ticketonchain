name: Test contratti Solidity

on:
  push:
    branches: ["main", "fix/contract-audit-2026-10"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Installa dipendenze Solidity
        run: |
          forge install OpenZeppelin/openzeppelin-contracts --no-commit
          forge install foundry-rs/forge-std --no-commit
      - name: Compila ed esegue i test
        run: forge test -vvv
