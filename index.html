<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d0d0d">
  <meta name="description" content="TicketOnChain">
  <title>TicketOnChain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="pagina">
    <h1 class="logo" aria-label="TicketOnChain">TICKETONCHAIN</h1>

    <section class="azioni" aria-label="Azioni principali">
      <div class="blocco blocco-ricerca">
        <label for="cerca-evento">Cerca evento</label>
        <form class="barra-ricerca" role="search">
          <input id="cerca-evento" name="q" type="search" placeholder="Nome evento, artista o luogo..." autocomplete="off">
          <button type="submit" class="pulsante-ricerca" aria-label="Cerca evento">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.8"></circle>
              <path d="m16 16 4.2 4.2"></path>
            </svg>
          </button>
        </form>
      </div>

      <div class="blocco blocco-pubblica">
        <span class="titolo-blocco">Pubblica evento</span>
        <button type="button" class="pulsante-pubblica">Pubblica evento</button>
      </div>
    </section>
  </main>
</body>
</html>
